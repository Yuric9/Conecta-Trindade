<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#005847" />
    <title>Sem conexão - Conecta Trindade</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #eef1ef; color: #1f2937; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #4b5563; line-height: 1.5; margin: 0 0 24px; }
      button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #006653; color: #fff;
               font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem internet</h1>
      <p>Verifique sua conexão. Assim que voltar, o Conecta Trindade abre normalmente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
