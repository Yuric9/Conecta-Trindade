<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Brasão / Emblema Municipal de Trindade -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="14" fill="#004d3e" stroke="#FFC20E" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#006653"/>
    <!-- Cruz e Raios Simbolizando a Capital da Fé -->
    <path d="M30 14 L30 46 M20 25 L40 25" stroke="#FFC20E" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="3" fill="#ffffff"/>
    <path d="M18 42 C24 38, 36 38, 42 42" stroke="#FFC20E" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Tipografia Oficial -->
  <text x="82" y="32" font-family="Montserrat, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFC20E" letter-spacing="2">PREFEITURA DE</text>
  <text x="82" y="52" font-family="Montserrat, system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">TRINDADE</text>
  <text x="82" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#A7F3D0" letter-spacing="1">CAPITAL DA FÉ • ZELO URBANO</text>
</svg>
